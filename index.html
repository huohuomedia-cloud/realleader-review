<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>瑞利达 · 四项修改审片</title><style>
:root{color-scheme:dark;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#161719;color:#e5e5e6}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #343538;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:20px;margin:0}header p,.note{font-size:14px;color:#a8abb0;margin:4px 0}button,input,select{font:inherit}button,select{background:#303236;border:1px solid #50535a;color:#eee;border-radius:6px;padding:7px 12px;cursor:pointer}button[data-action=play]{background:#cf2932;border-color:#e04c54;color:#fff}button[data-action=play]:hover{background:#e23b43}button:hover{background:#42454b}button:disabled{opacity:.5;cursor:wait}a{color:#a8cdfd}input[type=password]{background:#101113;color:#eee;border:1px solid #555;border-radius:6px;padding:12px;width:100%}#gate{max-width:420px;margin:12vh auto;padding:24px}#gate button{width:100%;margin-top:14px;background:#c82930}#error{color:#ffadae;min-height:24px;font-size:14px}#list{max-width:1600px;margin:auto;padding:10px 20px 30px}section{border:1px solid #383a3e;background:#1c1d20;margin:14px 0;border-radius:9px;overflow:hidden}section:focus{outline:1px solid #777}section h2{font-size:17px;margin:0}section .top{padding:12px 14px;border-bottom:1px solid #383a3e;display:flex;align-items:center;justify-content:space-between;gap:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.cell{min-width:0}.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}.viewport{overflow:hidden;background:#08090a;aspect-ratio:16/9;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain;transform-origin:center}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 12px 12px}.tools input[type=range]{flex:1;min-width:180px;accent-color:#c92f35}.tools output{font-variant-numeric:tabular-nums;font-size:14px;min-width:110px}.tools button,.caption button,.tools select{font-size:14px}.explain{padding:0 14px 12px;color:#aeb1b8;font-size:14px}.focus-left .pair,.focus-right .pair{grid-template-columns:1fr}.focus-left .cell:nth-child(2),.focus-right .cell:first-child{display:none}.focus-left video,.focus-right video{max-height:76vh}section:fullscreen{background:#161719;overflow:auto;display:flex;flex-direction:column;justify-content:center}section:fullscreen .viewport{max-height:76vh}#logout{font-size:14px}[hidden]{display:none!important}.status{font-size:14px;color:#bfc0c5}footer{text-align:center;font-size:14px;color:#85888e;padding:20px}@media(max-width:650px){header{padding:12px 16px}h1{font-size:17px}#list{padding:4px 8px}.pair{gap:6px;padding:8px}.caption{flex-wrap:wrap}.caption button{padding:4px 8px}.tools{gap:6px}.tools input[type=range]{flex-basis:100%}.top{flex-wrap:wrap}#gate{margin:8vh 12px}}
</style><header><div><h1>瑞利达 · 四项修改审片</h1><p>修改对比 · 审片 V4</p></div><button id="logout" hidden>退出审片</button></header>
<form id="gate"><h2>客户审片</h2><p class="note">输入审片口令，查看四项修改对比。</p><label for="password">审片口令</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock">打开审片</button><p id="error" role="status"></p></form><main id="list" hidden></main><footer>仅供本次修改审阅</footer>
<script>
const $=s=>document.querySelector(s), cfg={"salt": "KiYU8bjKYvI2kQw8IMjHfA==", "manifest": "media/6bb49dd074d7e862c34b84ce.bin"};let key,urls=[],players=[];
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(path){const r=await fetch(path);if(!r.ok)throw Error('素材载入失败，请重试');const b=new Uint8Array(await r.arrayBuffer());return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))}
$('#gate').onsubmit=async e=>{e.preventDefault();$('#unlock').disabled=true;$('#error').textContent='正在解锁…';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('#password').value),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(cfg.salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const manifest=JSON.parse(new TextDecoder().decode(await decrypt(cfg.manifest)));$('#password').value='';$('#list').replaceChildren();manifest.shots.forEach(build);$('#gate').hidden=true;$('#list').hidden=false;$('#logout').hidden=false;}catch(e){key=null;$('#error').textContent=e.message.includes('素材')?e.message:'口令不正确，或素材未能完整载入。';}finally{$('#unlock').disabled=false}};
$('#logout').onclick=()=>{players.forEach(p=>p.stop());players=[];urls.forEach(URL.revokeObjectURL);urls=[];key=null;$('#list').replaceChildren();$('#list').hidden=true;$('#gate').hidden=false;$('#logout').hidden=true;$('#error').textContent='';$('#password').focus()};
function build(d){const fps=d.fps||24;const el=document.createElement('section');el.tabIndex=0;el.innerHTML=`<div class="top"><h2>${d.id} · ${d.title}</h2><span class="status">准备播放</span></div><div class="pair"><div class="cell"><div class="caption"><span>原版</span><button data-view="left">放大原片</button></div><div class="viewport"><video muted playsinline preload="metadata"></video></div></div><div class="cell"><div class="caption"><span>修改版</span><span><button data-view="right">放大结果</button> <button data-action="download">下载修改版</button></span></div><div class="viewport"><video muted playsinline preload="metadata"></video></div></div></div><div class="tools"><button data-action="play">播放</button><button data-action="start">从头</button><button data-action="prev">前一帧</button><button data-action="next">后一帧</button><select aria-label="播放速度"><option value="1">原速</option><option value="0.5">半速</option></select><label><input type="checkbox">循环</label><button data-action="both">双片</button><button data-action="full">全屏</button><select aria-label="画面倍率"><option value="1">适应</option><option value="1.5">150%</option><option value="2">200%</option></select><input type="range" min="0" max="${d.frames-1}" value="0" step="1" aria-label="${d.id} 同步时间轴"><output>0.00 / ${(d.frames/fps).toFixed(2)}s</output></div><p class="explain">${d.note}</p>`;$('#list').append(el);
const [s,r]=el.querySelectorAll('video'),seek=el.querySelector('input[type=range]'),state=el.querySelector('.status'),play=el.querySelector('[data-action=play]'),speed=el.querySelector('[aria-label=播放速度]'),zoom=el.querySelector('[aria-label=画面倍率]'),loop=el.querySelector('input[type=checkbox]');let running=false,loaded=false,loading=null,dead=false;
function stop(){running=false;s.pause();r.pause();play.textContent='播放'}
players.push({stop});
async function load(){if(loaded)return;if(loading)return loading;state.textContent='正在载入视频…';loading=(async()=>{try{for(const [v,path]of [[s,d.source],[r,d.result]]){const data=await decrypt(path);if(!key)return;const u=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));urls.push(u);await new Promise((resolve,reject)=>{v.onloadeddata=resolve;v.onerror=()=>reject(Error('视频无法播放'));v.src=u;v.load()})}loaded=true;state.textContent='已载入'; }catch(e){state.textContent=e.message;throw e}finally{loading=null}})();return loading}
function at(v,t){v.currentTime=Math.max(0,Math.min(t,(v===s?d.sourceFrames:d.frames)/fps-1/240))}
function show(f){seek.value=f;el.querySelector('output').textContent=(f/fps).toFixed(2)+' / '+(d.frames/fps).toFixed(2)+'s'}
async function jump(f){stop();await load();f=Math.max(0,Math.min(d.frames-1,f));at(s,(f+.01)/fps);at(r,(f+.01)/fps);show(f)}
async function start(){players.forEach(p=>p.stop());await load();if(r.ended||+seek.value>=d.frames-1)await jump(0);s.playbackRate=r.playbackRate=+speed.value;running=true;play.textContent='暂停';await Promise.all([r.play(),s.play()]);tick()}
function tick(){if(!running||!el.isConnected)return;const f=Math.min(d.frames-1,Math.floor(r.currentTime*fps));show(f);if(Math.abs(s.currentTime-Math.min(r.currentTime,(d.sourceFrames-1)/fps))>.06)at(s,r.currentTime);requestAnimationFrame(tick)}
r.onended=async()=>{if(loop.checked&&running){await jump(0);await start()}else{stop();show(d.frames-1)}};
el.querySelector('[data-action=download]').onclick=async()=>{const b=el.querySelector('[data-action=download]');b.disabled=true;try{await load();const a=document.createElement('a');a.href=r.src;a.download=d.id+'_修改版.mp4';document.body.append(a);a.click();a.remove();state.textContent='下载已开始';}catch(e){state.textContent='下载失败，请重试';}finally{b.disabled=false}};
play.onclick=()=>{(running?Promise.resolve(stop()):start()).catch(e=>{stop();state.textContent=e.message})};seek.oninput=()=>jump(+seek.value).catch(e=>state.textContent=e.message);speed.onchange=()=>s.playbackRate=r.playbackRate=+speed.value;zoom.onchange=()=>{s.style.transform=r.style.transform=`scale(${zoom.value})`};
el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{el.classList.remove('focus-left','focus-right');el.classList.add('focus-'+b.dataset.view)});
el.querySelector('[data-action=both]').onclick=()=>{el.classList.remove('focus-left','focus-right');zoom.value=1;s.style.transform=r.style.transform=''};
el.querySelector('[data-action=start]').onclick=()=>jump(0);el.querySelector('[data-action=prev]').onclick=()=>jump(+seek.value-1);el.querySelector('[data-action=next]').onclick=()=>jump(+seek.value+1);el.querySelector('[data-action=full]').onclick=()=>el.requestFullscreen?.().catch(()=>state.textContent='请使用放大结果查看');
el.onkeydown=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Escape'){el.classList.remove('focus-left','focus-right');zoom.value=1;s.style.transform=r.style.transform=''}if(e.key===' '){e.preventDefault();play.click()}if(e.key==='ArrowRight'){e.preventDefault();jump(+seek.value+1)}if(e.key==='ArrowLeft'){e.preventDefault();jump(+seek.value-1)}};
const io=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){load().catch(()=>{});io.disconnect()}},{rootMargin:'200px'});io.observe(el);
}
</script></html>
